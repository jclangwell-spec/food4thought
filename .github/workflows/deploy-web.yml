name: Check and deploy web app

on:
  push:
    branches: [main, claude/flutter-setup-phase-1-lkfr9s]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deploy only once the Firebase deploy key has been added to the repo's secrets.
      CAN_DEPLOY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firestore-tests/package-lock.json
      # The Firestore emulator needs Java 21 or newer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test Firestore security rules
        working-directory: firestore-tests
        run: |
          npm ci
          npm test

      # Rules go first so new app code never runs against old rules.
      - name: Deploy Firestore security rules
        if: env.CAN_DEPLOY == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx --yes firebase-tools@15.32.1 deploy --only firestore:rules \
            --project food-for-thought-1e4c7 --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Deploy to Firebase Hosting
        if: env.CAN_DEPLOY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: food-for-thought-1e4c7
