name: Check and deploy web app

on:
  push:
    branches: [main, claude/flutter-setup-phase-1-lkfr9s]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Deploy only once the Firebase deploy key has been added to the repo's secrets.
      CAN_DEPLOY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

      - name: Deploy to Firebase Hosting
        if: env.CAN_DEPLOY == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
